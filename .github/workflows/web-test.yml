name: Web test build (private artifact)
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.6 and export templates
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip
          unzip -q Godot_v4.6-stable_linux.x86_64.zip
          chmod +x Godot_v4.6-stable_linux.x86_64
          mkdir -p ~/.local/share/godot/export_templates/4.6.stable
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.6-stable/Godot_v4.6-stable_export_templates.tpz
          unzip -q Godot_v4.6-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/4.6.stable/
      - name: Export HTML5
        run: |
          mkdir -p build/web
          ./Godot_v4.6-stable_linux.x86_64 --headless --path . --import
          ./Godot_v4.6-stable_linux.x86_64 --headless --path . --export-release Web build/web/index.html
      - name: Upload private build artifact (not publicly hosted)
        uses: actions/upload-artifact@v4
        with:
          name: manjushage-web-test
          path: build/web/
          if-no-files-found: error
          retention-days: 1
