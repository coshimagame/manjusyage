name: Art catalog and reference validation
on:
  push:
    branches:
      - cleanup/canon-and-art-folders-20261106
  pull_request:
    paths:
      - 'art/**'
      - 'docs/manjushage/**'
      - 'art_catalog.gd'
      - 'tests/test_art_slots.gd'
      - '.github/workflows/art-catalog-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-art:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.6
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v4.6-stable_linux.x86_64
          sudo install /tmp/godot-bin/Godot_v4.6-stable_linux.x86_64 /usr/local/bin/godot
      - name: Check preserved legacy art paths and documentation
        shell: bash
        run: |
          set -euo pipefail
          test -f art_catalog.gd
          test -f tests/test_art_slots.gd
          test -f docs/manjushage/CURRENT_SPEC.md
          test -f docs/manjushage/ART_ASSETS.md
          test -d art/active
          test -d art/characters/cormii
          test -d art/characters/jiyoza
          test -d art/characters/mafio
          test -d art/enemies
          test -d art/backgrounds
          test -d art/bullets
          test -d art/effects
          test -d art/items
      - name: Verify seven copied PNG files preserve original bytes
        shell: bash
        run: |
          set -euo pipefail
          pairs=(
            "art/active/ship_cormii.png art/characters/cormii/ship_cormii.png"
            "art/active/ship_jiyoza.png art/characters/jiyoza/ship_jiyoza.png"
            "art/active/ship_mafio.png art/characters/mafio/ship_mafio.png"
            "art/concepts/pilot_cormii_slim_v01.png art/characters/cormii/pilot_cormii_slim_v01.png"
            "art/concepts/pilot_jiyoza_slim_v01.png art/characters/jiyoza/pilot_jiyoza_slim_v01.png"
            "art/concepts/pilot_mafio_slim_v01.png art/characters/mafio/pilot_mafio_slim_v01.png"
            "art/active/title_logo.png art/backgrounds/title/title_logo.png"
          )
          for pair in "${pairs[@]}"; do
            read -r original copy <<< "$pair"
            test -s "$original"
            test -s "$copy"
            cmp "$original" "$copy"
            echo "MATCH: $original -> $copy"
          done
      - name: Import Godot resources
        run: godot --headless --path . --editor --import
      - name: Test catalog slots and fallbacks
        run: godot --headless --path . --script tests/test_art_slots.gd
