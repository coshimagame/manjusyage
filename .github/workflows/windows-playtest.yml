name: Windows daily playtest ZIP
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - ci/windows-playtest-zip-20261105
  schedule:
    - cron: '0 7 * * *' # 16:00 JST
permissions:
  contents: read
jobs:
  export-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate original story music
        run: node tools/build_story_music.cjs
      - name: Install Godot 4.6 and Windows export templates
        shell: bash
        run: |
          set -euo pipefail
          VERSION=4.6-stable
          curl -fL --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v4.6-stable_linux.x86_64
          sudo install /tmp/godot-bin/Godot_v4.6-stable_linux.x86_64 /usr/local/bin/godot
          curl -fL --retry 3 -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.6.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.6.stable/"
      - name: Import project resources
        run: godot --headless --path . --editor --import
      - name: Export Windows executable
        run: |
          mkdir -p build
          godot --headless --path . --export-release 'Windows Desktop' build/MANJUSHAGE.exe
          test -s build/MANJUSHAGE.exe
      - name: Add play instructions
        run: |
          printf '%s\n' 'MANJUSHAGE / Windows Playtest' '' 'Unzip the archive, then double-click MANJUSHAGE.exe.' 'Windows SmartScreen may warn about an unsigned development build.' 'Keyboard: Arrow keys to move, Z/X/C for actions. See README.md for details.' 'This is an untested development build, not a Steam release.' > build/PLAYTEST_README.txt
          cp README.md build/PROJECT_README.md
      - name: Upload playable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: MANJUSHAGE-Windows-${{ github.run_number }}
          path: build/
          if-no-files-found: error
          retention-days: 14
