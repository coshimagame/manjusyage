name: Capture actual Godot gameplay screenshots
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture_screenshots.yml'
      - 'game.gd'
      - 'art/active/title_logo.png'
      - 'art/active/title_backdrop.png'

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install display and Godot 4.6 Standard
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libgl1 libasound2t64 unzip fonts-noto-cjk
          curl -fLsS --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m755 /tmp/Godot_v4.6-stable_linux.x86_64 /usr/local/bin/godot
          fc-cache -f
          godot --version
      - name: Import and test all scripts in the game
        run: |
          mkdir -p /tmp/manjushage-user
          HOME=/tmp/manjushage-user godot --headless --editor --path . --import --quit > /tmp/import.log 2>&1 || { cat /tmp/import.log; exit 1; }
          cat /tmp/import.log
      - name: Capture actual running Godot frames
        run: |
          mkdir -p docs/screenshots/latest
          for mode in menu boss vertical briefing status; do
            echo "CAPTURE $mode"
            timeout 70s xvfb-run -a -s "-screen 0 1280x720x24" \
              godot --path . res://main.tscn --rendering-method gl_compatibility --audio-driver Dummy -- --bio --shot="$mode" \
              >"/tmp/screenshot-$mode.log" 2>&1 || true
            if [ -s "$mode.png" ]; then
              cp "$mode.png" "docs/screenshots/latest/$mode.png"
              echo "OK $mode"
            else
              echo "FAILED $mode"
              cat "/tmp/screenshot-$mode.log"
            fi
          done
          test -s docs/screenshots/latest/menu.png
          test -s docs/screenshots/latest/boss.png
          test -s docs/screenshots/latest/briefing.png
      - name: Check in current game captures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/latest
          if ! git diff --cached --quiet; then
            git commit -m "docs(screenshots): actual Godot 4.6 frames from latest gameplay [skip ci]"
            git push
          fi
      - name: Upload full screenshot package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manjushage-current-godot-screenshots
          path: |
            docs/screenshots/latest/*.png
            /tmp/import.log
            /tmp/screenshot-*.log
          if-no-files-found: ignore
